; SafeCell AI — ESP32 Firmware
; Target board: ESP32-WROOM-32
; Framework: Arduino (via PlatformIO)
;
; Libraries used:
;   NimBLE-Arduino   — BLE GATT server (lighter than classic ESP32 BLE stack)
;   ArduinoJson      — JSON telemetry serialization
;   OneWire          — DS18B20 temperature sensor 1-Wire protocol
;   DallasTemperature— DS18B20 high-level API
;   MQUnifiedsensor  — MQ-7 / MQ-8 gas sensor calibration math

[platformio]
src_dir = firmware
include_dir = firmware

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Serial monitor speed
monitor_speed = 115200

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=0

; Library dependencies (pinned versions for reproducibility)
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2
    bblanchon/ArduinoJson @ ^7.0.0
    paulstoffregen/OneWire @ ^2.3.7
    milesburton/DallasTemperature @ ^3.11.0
    miguel5612/MQUnifiedsensor @ ^3.0.0
